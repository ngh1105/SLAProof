version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    groups:
      next-stack:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@next/*"
      types:
        patterns:
          - "@types/*"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - ci
